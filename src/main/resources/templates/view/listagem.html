<form th:action="@{/restaurantes/filtrar}" method="get">
    <h3>Filtros</h3>
    <div>
        <label for="id">Código (ID):</label>
        <input type="number" id="id" name="id" placeholder="Ex: 1" />
    </div>
    <div>
        <label for="nome">Nome do Restaurante:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Outback" />
    </div>
    <div>
        <label for="minAvaliacao">Avaliação Mínima:</label>
        <input type="number" step="0.5" min="0" max="5" id="minAvaliacao" name="minAvaliacao" placeholder="0.0" />

        <label for="maxAvaliacao">Avaliação Máxima:</label>
        <input type="number" step="0.5" min="0" max="5" id="maxAvaliacao" name="maxAvaliacao" placeholder="5.0" />
    </div>
    <div>
        <label for="minEconomia">Economia Mínima (R$):</label>
        <input type="number" step="0.01" id="minEconomia" name="minEconomia" placeholder="0,00" />

        <label for="maxEconomia">Economia Máxima (R$):</label>
        <input type="number" step="0.01" id="maxEconomia" name="maxEconomia" placeholder="0,00" />
    </div>
    <div>
        <label for="minDataVisita">Data Inicial:</label>
        <input type="date" id="minDataVisita" name="minDataVisita" />

        <label for="maxDataVisita">Data Final:</label>
        <input type="date" id="maxDataVisita" name="maxDataVisita" />
    </div>

    <!-- Ordenação -->
    <div>
        <label for="atributo">Ordenar por:</label>
        <select id="atributo" name="atributo">
            <option value="nome">Nome</option>
            <option value="avaliacao">Avaliação</option>
            <option value="economia">Economia</option>
            <option value="dataVisita">Data da Visita</option>
        </select>
        <select name="ordem">
            <option value="ASC">Crescente (A-Z / Menor para Maior)</option>
            <option value="DESC">Decrescente (Z-A / Maior para Menor)</option>
        </select>
    </div>

    <!-- Submit -->
    <button type="submit">Aplicar</button>
    <a th:href="@{/restaurantes/inicio}">Limpar Filtros</a>
</form>


<!-- Listagem com filtro -->
<table th:if="${restaurantes_filtrados}">
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>Endereço</th>
        <th>Comentário</th>
        <th>Economia</th>
        <th>Avaliacao</th>
        <th>DataVisita</th>
    </tr>
    <tr th:each="r : ${restaurantes_filtrados}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.nome}"></td>
        <td th:text="${r.comentario}"></td>
        <td th:text="${r.economia}"></td>
        <td th:text="${r.avaliacao}"></td>
        <td th:text="${r.dataVisita}"></td>

        <td>
            <form th:action="@{/restaurantes/editar/{id}(id=${r.id})}"
                  method="get">
                <button type="submit">Editar</button>
            </form>
            <form th:action="@{/restaurantes/{id}(id=${r.id})}" method="post">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>

<!-- Listagem sem filtro -->
<table th:if="${!restaurantes_filtrados}">
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>Endereço</th>
        <th>Comentário</th>
        <th>Economia</th>
        <th>Avaliacao</th>
        <th>DataVisita</th>
    </tr>
    <tr th:each="r : ${restaurantes}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.nome}"></td>
        <td th:text="${r.comentario}"></td>
        <td th:text="${r.economia}"></td>
        <td th:text="${r.avaliacao}"></td>
        <td th:text="${r.dataVisita}"></td>

        <td>
            <form th:action="@{/restaurantes/editar/{id}(id=${r.id})}"
                  method="get">
                <button type="submit">Editar</button>
            </form>
            <form th:action="@{/restaurantes/{id}(id=${r.id})}" method="post">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
