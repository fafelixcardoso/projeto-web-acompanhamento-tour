<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restaurantes - Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #FFFEE6;">
<nav class="navbar border-bottom border-body" style="background-color: #003575;" data-bs-theme="dark">
    <div class="container-fluid ps-4">
        <a class="navbar-brand" th:href="@{/restaurantes/inicio}">
            <img src="https://checkout.tourlondrina.com.br/logo/tour-4.png" alt="Logo Tour Londrina" height="40" width="auto" class="d-inline-block align-text-top me-2">
        </a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-10 mx-auto">

            <div class="card mt-4 mb-4 shadow" style="background-color: #003575; border: none;">
                <div class="card-body text-white">
                    <h5 class="mb-3">Filtros e Ordenação</h5>
                    <form th:action="@{/restaurantes/inicio/filtros}" method="get">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-2">
                                <label for="nome" class="form-label small">Nome:</label>
                                <input type="text" class="form-control form-control-sm" id="nome" name="nome" placeholder="Ex: Outback">
                            </div>
                            <div class="col-md-2">
                                <label for="minAvaliacao" class="form-label small">Avaliação (Min/Max):</label>
                                <div class="input-group input-group-sm">
                                    <input type="number" step="0.5" class="form-control" id="minAvaliacao" name="minAvaliacao" placeholder="0.0">
                                    <input type="number" step="0.5" class="form-control" id="maxAvaliacao" name="maxAvaliacao" placeholder="5.0">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label for="minEconomia" class="form-label small">Economia (Min/Max):</label>
                                <div class="input-group input-group-sm">
                                    <input type="number" step="0.01" class="form-control" id="minEconomia" name="minEconomia" placeholder="R$ Min">
                                    <input type="number" step="0.01" class="form-control" id="maxEconomia" name="maxEconomia" placeholder="R$ Max">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <label for="atributo" class="form-label small">Ordenar por:</label>
                                <select class="form-select form-select-sm" id="atributo" name="atributo">
                                    <option value="nome">Nome</option>
                                    <option value="avaliacao">Avaliação</option>
                                    <option value="economia">Economia</option>
                                    <option value="dataVisita">Data</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label for="ordem" class="form-label small">Ordem:</label>
                                <select class="form-select form-select-sm" name="ordem" id="ordem">
                                    <option value="ASC">Crescente</option>
                                    <option value="DESC">Decrescente</option>
                                </select>
                            </div>
                            <div class="col-md-1">
                                <button type="submit" class="btn btn-sm text-white w-100 fw-bold" style="background-color: #589F2E;">Aplicar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mt-4 mb-4 shadow" style="background-color: #003575; border: none;">
                <div class="card-body text-white">

                    <div class="position-relative d-flex align-items-center justify-content-center mb-4">
                        <h2 class="mb-0 text-center">Lista de Restaurantes</h2>
                        <a th:href="@{/restaurantes/novo}" class="btn text-white fw-bold position-absolute end-0" style="background-color: #589F2E;">
                            + Cadastrar
                        </a>
                    </div>

                    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${msg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${msg_erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${msg_erro}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div class="table-responsive rounded">
                        <table class="table table-hover table-striped table-light align-middle mb-0">
                            <thead class="text-white" style="background-color: #0060AD; --bs-table-bg: #0060AD; --bs-table-color: #ffffff;">
                            <tr>
                                <th class="text-center">ID</th>
                                <th class="text-start">Nome</th>
                                <th class="text-start">Endereço</th>
                                <th class="text-start" style="max-width: 220px;">Comentário</th>
                                <th class="text-center" style="white-space: nowrap;">Economia</th>
                                <th class="text-center" style="white-space: nowrap;">Avaliação</th>
                                <th class="text-center" style="white-space: nowrap;">Data Visita</th>
                                <th class="text-center" style="white-space: nowrap; width: 140px;">Ações</th>
                            </tr>
                            </thead>
                            <tbody class="border-top-0">
                            <tr th:each="r : ${restaurantes_filtrados != null ? restaurantes_filtrados : restaurantes}">
                                <td th:text="${r.id}" class="text-center fw-bold"></td>
                                <td th:text="${r.nome}" class="text-start"></td>
                                <td th:text="${r.endereco}" class="text-start"></td>
                                <td th:text="${r.comentario}" class="text-start text-break" style="max-width: 220px;"></td>
                                <td th:text="${r.economia != null ? 'R$ ' + #numbers.formatDecimal(r.economia, 1, 'POINT', 2, 'COMMA') : '-'}" class="text-center" style="white-space: nowrap;"></td>
                                <td th:text="${r.avaliacao}" class="text-center" style="white-space: nowrap;"></td>
                                <td th:text="${r.dataVisita != null ? #temporals.format(r.dataVisita, 'dd/MM/yyyy') : '-'}" class="text-center" style="white-space: nowrap;"></td>
                                <td class="text-center" style="white-space: nowrap;">
                                    <a th:href="@{/restaurantes/editar/{id}(id=${r.id})}"
                                       class="btn btn-sm btn-primary me-1">
                                        Editar
                                    </a>
                                    <button type="button" class="btn btn-sm btn-danger"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="|#confirmarExclusao-${r.id}|">
                                        Excluir
                                    </button>

                                    <div class="modal fade" th:id="|confirmarExclusao-${r.id}|" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content text-dark">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Excluir Restaurante</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                                                </div>
                                                <div class="modal-body text-start">
                                                    Tem certeza de que deseja excluir o restaurante
                                                    <strong th:text="${r.nome}"></strong>?
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                    <form th:action="@{/restaurantes/{id}(id=${r.id})}" th:method="delete" class="d-inline">
                                                        <button type="submit" class="btn btn-danger">Excluir</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
